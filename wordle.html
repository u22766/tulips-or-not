<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#131118">
<meta name="color-scheme" content="dark">
<title>Family Wordle</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    color-scheme:dark;
    --bg:#131118;--surface:#1d1a26;--surface-2:#252131;--line:#2e2a3a;
    --text:#f2eee5;--muted:#8e8aa0;
    --correct:#46a171;--present:#d9a13f;--absent:#3a3646;--accent:#e2704d;
    --gold:#e8c15a;--silver:#c0c4cf;--bronze:#c98a5b;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  html,body{height:100%}
  body{
    min-height:100dvh;
    background:radial-gradient(1200px 500px at 50% -10%,#221d31 0%,transparent 60%),var(--bg);
    color:var(--text);font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;overflow:hidden;
  }
  header{
    width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;border-bottom:1px solid var(--line);
  }
  .wordmark{line-height:1}
  .wordmark .eyebrow{display:block;font-size:.56rem;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3px}
  .wordmark .title{font-family:var(--serif);font-size:1.4rem;font-weight:600;letter-spacing:.06em}
  .hdr-actions{display:flex;gap:7px;align-items:center}
  .hdr-btn{
    background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-size:1rem;
    cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--sans);
    transition:border-color .15s,transform .1s;
  }
  .hdr-btn:active{transform:scale(.94)}
  .hdr-btn:hover{border-color:var(--accent)}
  #player-chip{font-size:.8rem;font-weight:700;max-width:120px}
  #chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #board-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;gap:8px}
  #mode-tag{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  #board{display:grid;gap:6px}
  .tile{
    display:flex;align-items:center;justify-content:center;font-weight:800;
    text-transform:uppercase;border:2px solid var(--line);border-radius:8px;
    background:transparent;color:var(--text);transition:border-color .12s,background .12s;
  }
  .tile.filled{border-color:#f2eee5;background:#f2eee5;color:#131118;animation:pop .12s ease}
  .tile.correct{background:var(--correct);border-color:var(--correct);color:#0d1f16}
  .tile.present{background:var(--present);border-color:var(--present);color:#241a05}
  .tile.absent{background:var(--absent);border-color:var(--absent);color:#9c96ad}
  .tile.flip{animation:flip .5s ease forwards}
  .tile.win-bounce{animation:bounce .6s ease}
  @keyframes pop{50%{transform:scale(1.1)}}
  @keyframes flip{50%{transform:rotateX(90deg)}}
  @keyframes bounce{30%{transform:translateY(-18px)}50%{transform:translateY(0)}70%{transform:translateY(-7px)}}
  @keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

  #toast-box{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:400;
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .toast{background:var(--text);color:#141118;padding:10px 20px;border-radius:10px;
    font-weight:700;font-size:.86rem;opacity:0;transition:opacity .25s;pointer-events:none;
    box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .toast.show{opacity:1}

  #keyboard{width:100%;max-width:520px;padding:6px 6px calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:6px}
  .kb-row{display:flex;justify-content:center;gap:5px}
  .key{height:52px;min-width:30px;padding:0 5px;border:none;border-radius:8px;
    background:var(--surface-2);color:var(--text);font-size:.85rem;font-weight:700;
    text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex:1;max-width:44px;font-family:var(--sans);transition:background .15s,color .15s,transform .06s}
  .key:active{transform:scale(.93)}
  .key.wide{flex:1.6;max-width:70px;font-size:.66rem}
  .key.correct{background:var(--correct);color:#0d1f16}
  .key.present{background:var(--present);color:#241a05}
  .key.absent{background:#231f2d;color:#5b5570}

  .overlay{position:fixed;inset:0;background:rgba(10,8,15,.78);display:none;
    align-items:flex-end;justify-content:center;z-index:500;backdrop-filter:blur(3px)}
  @media(min-width:480px){.overlay{align-items:center}}
  .overlay.open{display:flex}
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:24px 22px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:460px;
    max-height:86dvh;overflow-y:auto;animation:slideUp .25s ease}
  @media(min-width:480px){.sheet{border-radius:20px;padding-bottom:24px}}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}}
  .sheet h2{font-family:var(--serif);font-size:1.32rem;font-weight:600;margin-bottom:4px}
  .sheet .sub{color:var(--muted);font-size:.8rem;margin-bottom:18px;line-height:1.45}

  .btn{border:none;border-radius:12px;padding:14px 22px;width:100%;font-size:.92rem;
    font-weight:800;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;
    font-family:var(--sans);transition:filter .15s,transform .08s}
  .btn:active{transform:scale(.98)}
  .btn:hover{filter:brightness(1.12)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn+.btn{margin-top:10px}

  #result-word{font-family:var(--serif);font-size:1.55rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--correct);text-align:center;margin:6px 0 16px;padding-left:.28em}
  #result-title{text-align:center}
  .stat-row{display:flex;gap:6px;margin-bottom:20px}
  .stat-card{flex:1;background:var(--surface-2);border-radius:12px;padding:12px 4px;text-align:center}
  .stat-card .n{font-size:1.45rem;font-weight:800}
  .stat-card .l{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}

  .player-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .player-row{display:flex;align-items:center;gap:12px;background:var(--surface-2);
    border:1px solid transparent;border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
  .player-row:hover,.player-row.active{border-color:var(--accent)}
  .player-row .pe{font-size:1.45rem}
  .player-row .pn{font-weight:700;flex:1;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player-row .pw{font-size:.72rem;color:var(--muted);white-space:nowrap}
  .player-row .del{background:none;border:none;color:var(--muted);font-size:.95rem;cursor:pointer;padding:4px 6px;border-radius:6px}
  .player-row .del:hover{color:#e06c75}

  .add-form{display:flex;flex-direction:column;gap:12px}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .emoji-opt{font-size:1.25rem;background:var(--surface-2);border:2px solid transparent;
    border-radius:10px;padding:7px 0;cursor:pointer;text-align:center}
  .emoji-opt.sel{border-color:var(--accent)}
  #name-input{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    color:var(--text);padding:13px 16px;font-size:1rem;width:100%;font-family:var(--sans);outline:none}
  #name-input:focus{border-color:var(--accent)}

  .seg{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:12px;margin-bottom:8px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);font-family:var(--sans);
    font-weight:700;font-size:.8rem;padding:11px 4px;border-radius:8px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--accent);color:#fff}
  .seg-note{font-size:.72rem;color:var(--muted);line-height:1.5;margin-bottom:16px}

  .lb-podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0 22px}
  .pod{text-align:center;flex:1;max-width:108px}
  .pod .pe{font-size:1.9rem}
  .pod .pn{font-size:.76rem;font-weight:700;margin:4px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pod .bar{border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:1.15rem;color:#141118}
  .pod.p1 .bar{height:72px;background:var(--gold)}
  .pod.p2 .bar{height:52px;background:var(--silver)}
  .pod.p3 .bar{height:38px;background:var(--bronze)}
  .lb-table{width:100%;border-collapse:collapse;font-size:.82rem}
  .lb-table th{color:var(--muted);font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;
    text-align:right;padding:6px 6px;font-weight:700}
  .lb-table th:first-child,.lb-table td:first-child{text-align:left}
  .lb-table td{padding:10px 6px;text-align:right;border-top:1px solid var(--line)}
  .lb-table td:first-child{font-weight:700}
  .lb-empty{text-align:center;color:var(--muted);padding:30px 0;font-size:.88rem;line-height:1.5}

  .confetti{position:fixed;width:8px;height:8px;border-radius:2px;z-index:600;
    pointer-events:none;animation:cf 2.5s ease-out forwards}
  @keyframes cf{to{opacity:0;transform:translateY(100vh) rotate(720deg)}}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<header>
  <a href="games.html" class="wordmark" style="text-decoration:none;color:inherit">
    <span class="eyebrow">Family Edition</span>
    <span class="title">Wordle</span>
  </a>
  <div class="hdr-actions">
    <button class="hdr-btn" id="player-chip" onclick="openPlayers()">
      <span id="chip-emoji">👤</span><span id="chip-name">Player</span>
    </button>
    <button class="hdr-btn" onclick="openLeaderboard()" title="Rankings">🏆</button>
    <button class="hdr-btn" onclick="openSettings()" title="Settings">⚙</button>
  </div>
</header>

<div id="board-wrap">
  <div id="mode-tag"></div>
  <div id="board"></div>
</div>
<div id="toast-box"></div>

<div id="keyboard">
  <div class="kb-row" id="kr0"></div>
  <div class="kb-row" id="kr1"></div>
  <div class="kb-row" id="kr2"></div>
</div>

<div class="overlay" id="ov-result"><div class="sheet">
  <h2 id="result-title"></h2>
  <div id="result-word"></div>
  <div class="stat-row">
    <div class="stat-card"><div class="n" id="rs-played">0</div><div class="l">Played</div></div>
    <div class="stat-card"><div class="n" id="rs-win">0%</div><div class="l">Win rate</div></div>
    <div class="stat-card"><div class="n" id="rs-streak">0</div><div class="l">Streak</div></div>
    <div class="stat-card"><div class="n" id="rs-avg">–</div><div class="l">Avg tries</div></div>
  </div>
  <button class="btn btn-primary" onclick="passAndPlay()">Next player ➜</button>
  <button class="btn btn-ghost" onclick="newGame()">Play again</button>
  <button class="btn btn-ghost" onclick="shareResult()">Share result</button>
</div></div>

<div class="overlay" id="ov-players"><div class="sheet">
  <h2>Who's playing?</h2>
  <div class="sub">Tap a name to play as them. Scores are tracked per person.</div>
  <div class="player-list" id="player-list"></div>
  <div class="add-form">
    <input id="name-input" type="text" maxlength="14" placeholder="Add a new player…" autocomplete="off">
    <div class="emoji-grid" id="emoji-grid"></div>
    <button class="btn btn-primary" onclick="addPlayer()">Add player</button>
  </div>
</div></div>

<div class="overlay" id="ov-settings"><div class="sheet">
  <h2>Difficulty</h2>
  <div class="sub">Changing this starts a new round.</div>
  <div class="seg" id="diff-seg">
    <button data-d="easy" onclick="setDifficulty('easy')">Easy</button>
    <button data-d="normal" onclick="setDifficulty('normal')">Normal</button>
    <button data-d="hard" onclick="setDifficulty('hard')">Hard</button>
  </div>
  <div class="seg-note" id="diff-note"></div>
  <button class="btn btn-ghost" onclick="closeOverlays()">Done</button>
</div></div>

<div class="overlay" id="ov-lb"><div class="sheet">
  <h2>🏆 Family Rankings</h2>
  <div class="sub">Ranked by wins, then win rate, then fewest average guesses.</div>
  <div id="lb-content"></div>
  <button class="btn btn-ghost" onclick="closeOverlays()" style="margin-top:16px">Close</button>
</div></div>

function unpack(s){ const a=[]; for(let i=0;i<s.length;i+=5) a.push(s.substr(i,5)); return a; }
const EASY_WORDS = unpack(P_EASY);
const ALL_ANSWERS = unpack(P_ANSWERS);
const VALID_SET = new Set(unpack(P_VALID));

const MODES = {
  easy:   {pool:EASY_WORDS,   rows:7, label:'Easy · 7 guesses',   note:'Answers come from the 800 most common English words, and you get an extra guess. Best for younger players.'},
  normal: {pool:ALL_ANSWERS,  rows:6, label:'Normal · 6 guesses', note:'The official Wordle answer list — 2,315 curated words, six guesses. This matches the real game.'},
  hard:   {pool:ALL_ANSWERS,  rows:6, label:'Hard · locked hints', note:'Same words as Normal, but any green or yellow letter you find must be reused in every later guess.'}
};

// ═══════════ PLAYERS ═══════════
const LS_PLAYERS='fw-players', LS_CURRENT='fw-current', LS_DIFF='fw-diff';
const EMOJIS=['😀','😎','🤓','🥳','🦊','🐼','🐸','🦄','🐙','🦁','🐨','🌸','⚡','🔥','🌈','🚀','🎩','👑','🍕','🏄','🎸','🐶','😺','👽'];

let players=JSON.parse(localStorage.getItem(LS_PLAYERS)||'[]');
let currentId=localStorage.getItem(LS_CURRENT)||null;
let difficulty=localStorage.getItem(LS_DIFF)||'normal';
if(!MODES[difficulty]) difficulty='normal';
let selEmoji=EMOJIS[0];

function savePlayers(){ localStorage.setItem(LS_PLAYERS,JSON.stringify(players)); }
function cur(){ return players.find(p=>p.id===currentId)||null; }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function addPlayer(){
  const input=document.getElementById('name-input');
  const name=input.value.trim();
  if(!name){ toast('Enter a name first'); return; }
  if(players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ toast('Name already taken'); return; }
  const p={id:Date.now().toString(36),name,emoji:selEmoji,stats:{played:0,won:0,streak:0,best:0,winGuesses:0}};
  players.push(p); savePlayers(); input.value='';
  selectPlayer(p.id);
}
function selectPlayer(id){
  currentId=id; localStorage.setItem(LS_CURRENT,id);
  renderChip(); renderPlayerList(); closeOverlays(); newGame();
}
function deletePlayer(id,ev){
  ev.stopPropagation();
  const p=players.find(x=>x.id===id);
  if(!confirm('Remove '+p.name+' and their scores?')) return;
  players=players.filter(x=>x.id!==id); savePlayers();
  if(currentId===id){ currentId=null; localStorage.removeItem(LS_CURRENT); renderChip(); }
  renderPlayerList();
}
function renderChip(){
  const p=cur();
  document.getElementById('chip-emoji').textContent=p?p.emoji:'👤';
  document.getElementById('chip-name').textContent=p?p.name:'Player';
}
function renderPlayerList(){
  const el=document.getElementById('player-list'); el.innerHTML='';
  players.forEach(p=>{
    const row=document.createElement('div');
    row.className='player-row'+(p.id===currentId?' active':'');
    row.onclick=()=>selectPlayer(p.id);
    const wr=p.stats.played?Math.round(p.stats.won/p.stats.played*100):0;
    row.innerHTML='<span class="pe">'+p.emoji+'</span><span class="pn">'+esc(p.name)+
      '</span><span class="pw">'+p.stats.won+'W · '+wr+'%</span><button class="del">✕</button>';
    row.querySelector('.del').onclick=e=>deletePlayer(p.id,e);
    el.appendChild(row);
  });
}
function renderEmojiGrid(){
  const g=document.getElementById('emoji-grid'); g.innerHTML='';
  EMOJIS.forEach(e=>{
    const b=document.createElement('div');
    b.className='emoji-opt'+(e===selEmoji?' sel':''); b.textContent=e;
    b.onclick=()=>{ selEmoji=e; renderEmojiGrid(); };
    g.appendChild(b);
  });
}

// ═══════════ SETTINGS ═══════════
function openSettings(){ renderSettings(); openOverlay('ov-settings'); }
function renderSettings(){
  document.querySelectorAll('#diff-seg button').forEach(b=>
    b.classList.toggle('on', b.dataset.d===difficulty));
  document.getElementById('diff-note').textContent=MODES[difficulty].note;
}
function setDifficulty(d){
  if(d===difficulty){ return; }
  difficulty=d; localStorage.setItem(LS_DIFF,d);
  renderSettings(); newGame();
}

// ═══════════ LEADERBOARD ═══════════
function ranked(){
  return players.filter(p=>p.stats.played>0).sort((a,b)=>{
    if(b.stats.won!==a.stats.won) return b.stats.won-a.stats.won;
    const wa=a.stats.won/a.stats.played, wb=b.stats.won/b.stats.played;
    if(wb!==wa) return wb-wa;
    const ga=a.stats.won?a.stats.winGuesses/a.stats.won:99;
    const gb=b.stats.won?b.stats.winGuesses/b.stats.won:99;
    return ga-gb;
  });
}
function openLeaderboard(){
  const r=ranked(), el=document.getElementById('lb-content');
  if(!r.length){
    el.innerHTML='<div class="lb-empty">No games played yet.<br>Finish a round to get on the board.</div>';
  } else {
    let html='';
    const cls={}; if(r[0])cls[r[0].id]='p1'; if(r[1])cls[r[1].id]='p2'; if(r[2])cls[r[2].id]='p3';
    const medal={p1:'1',p2:'2',p3:'3'};
    const podOrder=[r[1],r[0],r[2]].filter(Boolean);
    html+='<div class="lb-podium">';
    podOrder.forEach(p=>{
      const c=cls[p.id];
      html+='<div class="pod '+c+'"><div class="pe">'+p.emoji+'</div><div class="pn">'+
        esc(p.name)+'</div><div class="bar">'+medal[c]+'</div></div>';
    });
    html+='</div><table class="lb-table"><tr><th>Player</th><th>W</th><th>Win %</th><th>Streak</th><th>Avg</th></tr>';
    r.forEach((p,i)=>{
      const s=p.stats, wr=Math.round(s.won/s.played*100);
      const avg=s.won?(s.winGuesses/s.won).toFixed(1):'–';
      html+='<tr><td>'+(i+1)+'. '+p.emoji+' '+esc(p.name)+'</td><td>'+s.won+'</td><td>'+
        wr+'%</td><td>'+s.streak+'</td><td>'+avg+'</td></tr>';
    });
    html+='</table>';
    el.innerHTML=html;
  }
  openOverlay('ov-lb');
}

// ═══════════ GAME ═══════════
let answer,guesses,currentGuess,row,gameOver,revealing=false,maxRows=6;
let tiles=[]; const keyEls={};
const kbRows=[['q','w','e','r','t','y','u','i','o','p'],
              ['a','s','d','f','g','h','j','k','l'],
              ['Enter','z','x','c','v','b','n','m','⌫']];

function buildKeyboard(){
  kbRows.forEach((keys,ri)=>{
    const rowEl=document.getElementById('kr'+ri);
    keys.forEach(k=>{
      const b=document.createElement('button');
      b.className='key'+(k.length>1?' wide':'');
      b.textContent=k;
      b.addEventListener('click',()=>handleKey(k));
      rowEl.appendChild(b);
      keyEls[k.toLowerCase()]=b;
    });
  });
}

function buildBoard(rows){
  const board=document.getElementById('board');
  board.innerHTML=''; tiles=[];
  // Tile size shrinks when there are more rows so the board always fits
  const size='min(58px, calc((100vw - 64px)/5), calc((100dvh - 300px)/'+rows+'))';
  board.style.gridTemplateRows='repeat('+rows+','+size+')';
  board.style.gridTemplateColumns='repeat(5,'+size+')';
  for(let r=0;r<rows;r++){
    tiles[r]=[];
    for(let c=0;c<5;c++){
      const t=document.createElement('div');
      t.className='tile';
      t.style.fontSize='calc('+size+' * .46)';
      board.appendChild(t); tiles[r][c]=t;
    }
  }
}

function newGame(){
  closeOverlays();
  const mode=MODES[difficulty];
  maxRows=mode.rows;
  answer=mode.pool[Math.floor(Math.random()*mode.pool.length)];
  guesses=[]; currentGuess=''; row=0; gameOver=false; revealing=false;
  buildBoard(maxRows);
  document.getElementById('mode-tag').textContent=mode.label;
  Object.values(keyEls).forEach(k=>k.classList.remove('correct','present','absent'));
}

function passAndPlay(){ closeOverlays(); openPlayers(); }

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(document.getElementById('ov-players').classList.contains('open')){
    if(e.key==='Enter'&&document.activeElement===document.getElementById('name-input')) addPlayer();
    return;
  }
  if(document.querySelector('.overlay.open')) return;
  if(e.key==='Enter') handleKey('Enter');
  else if(e.key==='Backspace') handleKey('⌫');
  else if(/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toLowerCase());
});

function handleKey(k){
  if(gameOver||revealing) return;
  if(!cur()){ openPlayers(); return; }
  if(k==='⌫'){
    if(currentGuess.length){
      currentGuess=currentGuess.slice(0,-1);
      tiles[row][currentGuess.length].textContent='';
      tiles[row][currentGuess.length].classList.remove('filled');
    }
  } else if(k==='Enter'){ submitGuess(); }
  else if(k.length===1&&/[a-z]/.test(k)&&currentGuess.length<5){
    currentGuess+=k;
    const t=tiles[row][currentGuess.length-1];
    t.textContent=k; t.classList.add('filled');
  }
}

// Hard mode: revealed hints must be reused
function hardModeError(guess){
  if(difficulty!=='hard') return null;
  for(const g of guesses){
    for(let i=0;i<5;i++){
      if(g.result[i]==='correct' && guess[i]!==g.word[i])
        return 'Position '+(i+1)+' must be '+g.word[i].toUpperCase();
      if(g.result[i]==='present' && !guess.includes(g.word[i]))
        return 'Guess must contain '+g.word[i].toUpperCase();
    }
  }
  return null;
}

function submitGuess(){
  if(currentGuess.length<5){ shakeRow(); toast('Not enough letters'); return; }
  if(!VALID_SET.has(currentGuess)){ shakeRow(); toast('Not in word list'); return; }
  const hm=hardModeError(currentGuess);
  if(hm){ shakeRow(); toast(hm); return; }

  const result=evaluate(currentGuess,answer);
  guesses.push({word:currentGuess,result});
  revealing=true;
  const g=currentGuess, thisRow=row;

  for(let i=0;i<5;i++){
    const tile=tiles[thisRow][i], r=result[i];
    setTimeout(()=>{
      tile.classList.add('flip');
      setTimeout(()=>{
        tile.classList.add(r);
        const key=keyEls[g[i]];
        if(r==='correct'){ key.classList.remove('present','absent'); key.classList.add('correct'); }
        else if(r==='present'&&!key.classList.contains('correct')){ key.classList.remove('absent'); key.classList.add('present'); }
        else if(r==='absent'&&!key.classList.contains('correct')&&!key.classList.contains('present')){ key.classList.add('absent'); }
      },250);
    },i*280);
  }

  const won=result.every(r=>r==='correct');
  const lost=(thisRow===maxRows-1)&&!won;

  setTimeout(()=>{
    revealing=false;
    if(won){
      for(let i=0;i<5;i++) setTimeout(()=>tiles[thisRow][i].classList.add('win-bounce'),i*90);
      gameOver=true; recordResult(true);
      setTimeout(()=>{ confetti(); showResult(true); },650);
    } else if(lost){
      gameOver=true; recordResult(false);
      setTimeout(()=>showResult(false),350);
    } else { row++; currentGuess=''; }
  },5*280+320);
}

function evaluate(guess,ans){
  const result=Array(5).fill('absent'), used=Array(5).fill(false);
  for(let i=0;i<5;i++) if(guess[i]===ans[i]){ result[i]='correct'; used[i]=true; }
  for(let i=0;i<5;i++){
    if(result[i]==='correct') continue;
    for(let j=0;j<5;j++){
      if(!used[j]&&guess[i]===ans[j]){ result[i]='present'; used[j]=true; break; }
    }
  }
  return result;
}

function recordResult(won){
  const p=cur(); if(!p) return;
  const s=p.stats; s.played++;
  if(won){ s.won++; s.streak++; if(s.streak>s.best) s.best=s.streak; s.winGuesses+=guesses.length; }
  else s.streak=0;
  savePlayers();
}

function showResult(won){
  const p=cur();
  const titles=['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!','Just made it!'];
  document.getElementById('result-title').textContent=
    won ? p.emoji+' '+(titles[guesses.length-1]||'Nice!') : p.emoji+' The word was…';
  document.getElementById('result-word').textContent=answer;
  const s=p.stats;
  document.getElementById('rs-played').textContent=s.played;
  document.getElementById('rs-win').textContent=Math.round(s.won/s.played*100)+'%';
  document.getElementById('rs-streak').textContent=s.streak;
  document.getElementById('rs-avg').textContent=s.won?(s.winGuesses/s.won).toFixed(1):'–';
  openOverlay('ov-result');
}

// ═══════════ UI HELPERS ═══════════
function openOverlay(id){ closeOverlays(); document.getElementById(id).classList.add('open'); }
function closeOverlays(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open')); }
function openPlayers(){ renderPlayerList(); renderEmojiGrid(); openOverlay('ov-players'); }

document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click',e=>{
    if(e.target!==o) return;
    if(o.id==='ov-players'&&!cur()) return;
    o.classList.remove('open');
  });
});

function shakeRow(){
  tiles[row].forEach(t=>{ t.style.animation='shake .3s ease'; });
  setTimeout(()=>tiles[row].forEach(t=>t.style.animation=''),350);
}

function toast(msg){
  const box=document.getElementById('toast-box');
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  box.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },1600);
}

function shareResult(){
  const p=cur(), em={correct:'🟩',present:'🟨',absent:'⬛'};
  const won=guesses.length&&guesses[guesses.length-1].result.every(r=>r==='correct');
  let text=p.emoji+' '+p.name+' — Wordle '+(won?guesses.length:'X')+'/'+maxRows+
    ' ('+difficulty+')\n\n';
  guesses.forEach(g=>{ text+=g.result.map(r=>em[r]).join('')+'\n'; });
  if(navigator.share){ navigator.share({text}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('Copied!')); }
  else toast('Share not available');
}

function confetti(){
  const colors=['#46a171','#d9a13f','#e2704d','#61afef','#c678dd','#e8c15a'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.top='-10px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=Math.random()*.8+'s';
    const s=4+Math.random()*6; c.style.width=s+'px'; c.style.height=s+'px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3600);
  }
}

window.addEventListener('resize',()=>{ if(tiles.length) buildBoardPreserve(); });
function buildBoardPreserve(){
  const snapshot=tiles.map(r=>r.map(t=>({txt:t.textContent,cls:t.className})));
  buildBoard(maxRows);
  snapshot.forEach((r,ri)=>r.forEach((t,ci)=>{
    if(tiles[ri]&&tiles[ri][ci]){
      tiles[ri][ci].textContent=t.txt;
      const fs=tiles[ri][ci].style.fontSize;
      tiles[ri][ci].className=t.cls;
      tiles[ri][ci].style.fontSize=fs;
    }
  }));
}

// ═══════════ START ═══════════
buildKeyboard();
renderChip();
if(cur()) newGame(); else { buildBoard(MODES[difficulty].rows);
  document.getElementById('mode-tag').textContent=MODES[difficulty].label; openPlayers(); }
</script>
